name: Scrape & Send to Discord

on:
  schedule:
    # 09:00, 13:00, 18:00, 21:00 BRT (UTC-3)
    # -> 12:00, 16:00, 21:00, 00:00 UTC
    - cron: '0 0,12,16,21 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub no navegador

jobs:
  scrape-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Scraper & Discord Publisher
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION_ROLE: ${{ secrets.DISCORD_MENTION_ROLE }}
          ALLOWED_SENIORITIES: "intern,junior"
          JOB_SOURCES: "meupadrinho,remotar,gupy,ciee"
          MEUPADRINHO_MAX_PAGES: "5"
          REMOTAR_MAX_PAGES: "5"
          GUPY_MAX_PAGES_PER_KEYWORD: "1"
        run: npx tsx scripts/cron-job.ts
